<script>

      ],blocks:[
        {name:"Warm-up",kind:"tasks",items:[]},
        {name:"Handbalancing",kind:"tasks",items:[
          ["Straight kick-up di calibrazione","6–8 tentativi totali",""],["Equilibrio libero","10 minuti con recuperi reali","Registra secondi controllati, mediana e migliore tenuta calma."],["Tenute submassimali","3–5 set","Ferma prima che push e correzioni degenerino."],["Modulo endurance","Al massimo 1×/settimana","Solo dopo aver distinto perdita del push, correzioni insufficienti o calo generale."]

        {name:"Forza",kind:"strength",items:[
          ["Pull-up prona o lat machine","4 × 4–8","2 RIR · 2–3′"],["Distensione neutra manubri / floor press","4 × 6–10","Variante stabile · 2 RIR"],["Bulgarian split squat","3 × 6–10 per lato","Setup ripetibile"],["Alzate laterali","3 × 10–15","Senza slancio"],["Estensione tricipiti","3 × 8–15","2 RIR"]

        {name:"Mobilità attiva",kind:"tasks",items:[["Wall shoulder flexion lift-off","2 × 6–8",""],["Side lat stretch moderato","1 × 60″ per lato",""]]}
      ]},
      B:{title:"Ingressi tuck, tuck libera e Pike M3",duration:"105–120′",metrics:[
        ["tuckGood","Ingressi tuck buoni","number",""],["tuckTotal","Ingressi tuck totali","number",""],["tuckNote","Nota tuck / transizioni","text","qualità, profondità, controllo"]
      ],blocks:[
        {name:"Warm-up",kind:"tasks",items:[]},
        {name:"Handbalancing",kind:"tasks",items:[["Tuck jump to handstand","8–12 ingressi",""],["Straight ↔ tuck","3 × 1–3 transizioni",""],["Wall tuck slide","3 × 3–5","Pausa 2–3″."],["Tuck handstand libera","3–5 set di qualità",""],["Tuck negative assistita","2–3 × 1 · 5–8″","Solo se controllata."]]},
        {name:"Forza",kind:"strength",items:[["Back squat / front squat / leg press","4 × 4–8","Stessa variante nel blocco · 2 RIR"],["Rematore chest-supported o al cavo","4 × 6–10","Senza slancio · 2 RIR"],["Calf raise","3 × 10–15","Pausa in allungamento e in alto"],["Curl","3 × 8–12","2 RIR"],["Hammer curl","3 × 10–15","2 RIR"]]},
        {name:"Pike M3 · L1P1",kind:"m3",phase:"Pike L1P1",items:[["Three-position calf stretch","Template M3",""],["Hip flexor raises","Template M3",""],["Supine internal hip rotation","Template M3",""],["Single-leg forward-fold block crush","Template M3",""],["Locked-knee good mornings","Template M3",""]]}
      ]},
      C:{title:"Ingressi, libera e spinta verticale",duration:"95–110′",metrics:[
        ["tuckGood","Tuck buoni / totali","text","es. 6/8"],["straddleGood","Straddle buoni / totali","text","es. 5/7"],["straightGood","Straight buoni / totali","text","es. 4/5"],["controlled","Secondi controllati libera","number",""]
      ],blocks:[
        {name:"Warm-up",kind:"tasks",items:[]},
        {name:"Handbalancing",kind:"tasks",items:[["Tuck jump to handstand","6–8 ingressi",""],["Straddle jump to handstand","6–8 ingressi",""],["Straight kick-up","4–6 ingressi",""],["Equilibrio libero","8–10 minuti","Privilegia tentativi tecnicamente utili."],["Tentativi lunghi","Massimo 2","Solo se accuracy, push e attenzione sono stabili."]]},
        {name:"Forza",kind:"strength",items:[["Romanian deadlift / trap-bar deadlift","3 × 5–8","2 RIR · 2–3′"],["Chin-up o pull-up neutra","4 × 5–8","2 RIR"],["Pike push-up","4 × 5–8","Variante standardizzata · 2–3 RIR"],["Push-up zavorrato / spinta orizzontale","3 × 6–10","Non duplicare il cedimento"],["Face pull o reverse fly","3 × 12–15","Controllo scapolare"]]},
        {name:"Core",kind:"tasks",items:[["Lateral hanging knee raise","3 × 6–10 per lato",""],["Seated tuck/pike compression","2–3 × 6–10","Altezza mani standardizzata."]]},
        {name:"Mobilità attiva",kind:"tasks",items:[["90/90 transitions","1 × 6–10 totali",""],["Elephant walks facili","1 × 8–12 per lato",""],["Rotazioni delle spalle","1 × 8–10",""]]}
      ]},
      D:{title:"Straddle, pike e preparazione press",duration:"105–120′",metrics:[
        ["straddleGood","Ingressi straddle buoni / totali","text","es. 7/9"],["pikeLevel","Variante pike","text","wall pike / parziale"],["pikeSuccess","Successi pike","text","es. 3/6"]
      ],blocks:[
        {name:"Warm-up",kind:"tasks",items:[]},
        {name:"Handbalancing",kind:"tasks",items:[["Straddle jump to handstand","6–10 ingressi",""],["Straight → tuck → straight / straight → straddle → straight","3–4 round alternati",""],["Progressione pike","3 set","Wall pike oppure straight → pike parziale dopo il gate."],["Straddle negative assistita","3 × 1 · 5–8″","Solo se controllata."],["Play tecnico","3–5 minuti","Solo se attenzione e push restano alti."]]},
        {name:"Press preparation",kind:"tasks",items:[["P0 · Scapular push to standing pike","3 × 6–8",""],["P1 · Press float con piedi elevati","3–4 × 8–12″","Solo se P0 superato."],["P2 · Stomach-to-wall eccentric press","3 × 1 · 5–8″","Solo se P1 superato. Scegli una sola variante."]]},
        {name:"Forza",kind:"strength",items:[["Push-up zavorrato o dip controllato","3 × 6–10","Dip solo se tollerato"],["Rematore al cavo o con appoggio","4 × 8–12","2 RIR"],["Step-up o reverse lunge","3 × 8–10 per lato","ROM ripetibile"],["Alzate laterali","3 × 10–15","Senza slancio"],["Estensione tricipiti","3 × 10–15","2 RIR"]]},
        {name:"Pancake M3 · L1P1",kind:"m3",phase:"Pancake L1P1",items:[["Side hip flexor raises","Template M3",""],["Seated compression ER / CQI","Template M3",""],["Tailor pose lifts","Template M3",""],["Horse stance holds","Template M3","Il lato sinistro parte per primo, stessa dose e range pulito."]]}
      ]}
    }
  };
  window.HANDSTAND_PROGRAM = PROGRAM;
  return;
  const KEY = "handstand-practice-v3-state";
  const $ = (s,r=document)=>r.querySelector(s); const $$=(s,r=document)=>[...r.querySelectorAll(s)];
  const today=()=>new Date().toISOString().slice(0,10);
  const uid=()=>crypto?.randomUUID?.() || ("r-"+Date.now()+"-"+Math.random().toString(36).slice(2));
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
  const defaults=()=>({schemaVersion:APP.schemaVersion,programVersion:APP.programVersion,config:{cycleStart:today(),weekOverride:"",nextSession:"A",theme:"system"},records:[],active:null});
  function normalize(x){const d=defaults();if(!x||typeof x!=="object")return d;return {...d,...x,config:{...d.config,...x.config},records:Array.isArray(x.records)?x.records:[]};}
  let state; let storageOK=true; try{state=normalize(JSON.parse(localStorage.getItem(KEY)||"null"));}catch(e){state=defaults();storageOK=false}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false} updateStorageHint()}
  function phaseFor(w){return PROGRAM.phases.find(p=>{const n=p.weeks.split("–").map(Number);return w>=n[0]&&w<=(n[1]||n[0])})||PROGRAM.phases.at(-1)}
  function currentWeek(){const o=Number(state.config.weekOverride);if(o>=1&&o<=PROGRAM.weeks)return o;const start=new Date((state.config.cycleStart||today())+"T12:00:00"),now=new Date(today()+"T12:00:00");return Math.max(1,Math.min(PROGRAM.weeks,Math.floor((now-start)/604800000)+1))}
  function nextOf(s){return PROGRAM.sequence[(PROGRAM.sequence.indexOf(s)+1)%PROGRAM.sequence.length]}
  function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2800)}
  function setView(name){$$(".view").forEach(v=>v.classList.toggle("active",v.id===name+"View"));$$(".bottom button").forEach(b=>b.classList.toggle("active",b.dataset.view===name));if(name==="today")renderToday();if(name==="journal")renderJournal();if(name==="settings")renderSettings();if(name==="plan")renderPlan();window.scrollTo({top:0,behavior:"smooth"})}
  function theme(){const x=state.config.theme;document.documentElement.dataset.theme=x==="system"?"":x;$("#themeBtn").textContent=x==="dark"?"☀":"◐"}
  function sessionOptions(selected){return PROGRAM.sequence.map(s=>'<button type="button" class="'+(s===selected?"selected":"")+'" data-session="'+s+'">'+s+"</button>").join("")}
  function renderToday(){
    const s=(state.active&&state.active.session)||state.config.nextSession, w=(state.active&&state.active.week)||currentWeek(), p=phaseFor(w), session=PROGRAM.sessions[s], elapsed=state.active?Math.floor((Date.now()-state.active.startedAt+state.active.elapsedBefore)/1000):0;
    $("#todayView").innerHTML='<article class="card hero"><span class="eyebrow">Ciclo personale · settimana '+w+"/"+PROGRAM.weeks+'</span><h1>'+esc(session.title)+'</h1><p class="muted">'+esc(p.name)+" · "+esc(p.note)+'</p><div class="row"><span class="pill accent">Seduta '+s+'</span><span class="pill">'+esc(session.duration)+'</span>'+(state.active?'<span class="pill">In corso · <span id="timer">'+fmt(elapsed)+"</span></span>":"")+'</div></article>'+
    '<article class="card next"><div class="row between"><div class="row"><span class="session-code">'+s+'</span><div><h2>La tua prossima seduta</h2><p class="muted">La sequenza è continua: A → B → C → D.</p></div></div><button class="button ghost" id="chooseSession">Cambia</button></div><div id="sessionChooser" class="session-pick hidden">'+sessionOptions(s)+'</div><div class="weekbar" aria-label="Avanzamento ciclo">'+Array.from({length:18},(_,i)=>'<span class="'+(i+1<w?"done":i+1===w?"current":"")+'"></span>').join("")+'</div><div class="row" style="margin-top:1rem">'+(state.active?'<button class="button primary" id="resume">Riprendi seduta</button><button class="button" id="finishEarly">Chiudi e registra</button>':'<button class="button primary" id="start">Inizia seduta '+s+'</button>')+'</div></article>'+
    '<article class="card"><h2 class="section-title">Focus della settimana</h2><p>'+esc(p.note)+'</p><p class="tiny muted">Il calendario definisce la fase; la prossima lettera deriva dall’ultima seduta completata. Puoi correggere entrambi nelle impostazioni.</p></article>';
    $("#chooseSession").onclick=()=>$("#sessionChooser").classList.toggle("hidden");
    $$(".session-pick button").forEach(b=>b.onclick=()=>{state.config.nextSession=b.dataset.session;save();renderToday()});
    if($("#start"))$("#start").onclick=startSession;
    if($("#resume"))$("#resume").onclick=renderRunner;
    if($("#finishEarly"))$("#finishEarly").onclick=renderCheckout;
    if(state.active)startTicker();
  }
  function fmt(n){return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}
  let ticker;function startTicker(){clearInterval(ticker);ticker=setInterval(()=>{if(!state.active){clearInterval(ticker);return}const el=Math.floor((Date.now()-state.active.startedAt+state.active.elapsedBefore)/1000);const t=$("#timer");if(t)t.textContent=fmt(el);if(el%10===0)save()},1000)}
  function startSession(){const s=state.config.nextSession;state.active={id:uid(),session:s,week:currentWeek(),startedAt:Date.now(),elapsedBefore:0,checks:{},strength:{},m3:{},metrics:{},note:""};save();renderRunner()}
  function runnerBlock(block,i){const active=state.active, done=Object.entries(active.checks).filter(([key,value])=>key.startsWith("b"+i)&&value).length;let body="";
    if(block.kind==="strength")body=block.items.map((x,ei)=>strengthCard(x,ei)).join("");
    else {const items=block.name==="Warm-up"?PROGRAM.warmup.map(x=>[x[0],"",x[1]]):block.items;body=items.map((x,ti)=>{const k="b"+i+"t"+ti;return '<label class="task"><input type="checkbox" data-check="'+k+'" '+(active.checks[k]?"checked":"")+'><span><strong>'+esc(x[0])+'</strong><span class="dose">'+esc(x[1])+'</span><small>'+esc(x[2]||"")+'</small></span></label>'}).join("");if(block.kind==="m3")body+='<div class="formgrid" style="margin-top:.8rem"><label>RIR / DIR<input data-m3="'+i+'-effort" value="'+esc(active.m3[i]?.effort||"")+'" placeholder="es. 2 RIR · 10″ DIR"></label><label>Range / lato / nota<input data-m3="'+i+'-note" value="'+esc(active.m3[i]?.note||"")+'" placeholder="setup, sinistra, risposta"></label></div>'}
    return '<article class="card block-card" data-block="'+i+'"><div class="row between"><div><span class="eyebrow">Blocco '+(i+1)+"/"+PROGRAM.sessions[active.session].blocks.length+'</span><h2>'+esc(block.name)+'</h2></div><span class="pill">'+done+' completati</span></div>'+body+'</article>';
  }
  function prescribedSets(dose){const m=String(dose).match(/^(\d+)/);return m?Number(m[1]):3}
  function strengthCard(x,ei){const a=state.active, key="e"+ei, sets=a.strength[key]||Array.from({length:prescribedSets(x[1])},()=>({done:false,load:"",reps:"",rir:""}));a.strength[key]=sets;return '<section class="strength"><div class="strength-head">'+esc(x[0])+' <span class="dose">· '+esc(x[1])+'</span><div class="tiny muted">'+esc(x[2])+'</div></div>'+sets.map((set,si)=>'<div class="setline"><label class="checkline"><input type="checkbox" data-set="'+ei+":"+si+'" '+(set.done?"checked":"")+'> <span>'+ (si+1)+'</span></label><span></span><label>kg<input inputmode="decimal" data-field="'+ei+":"+si+':load" value="'+esc(set.load)+'"></label><label>reps<input inputmode="numeric" data-field="'+ei+":"+si+':reps" value="'+esc(set.reps)+'"></label><label>RIR<input inputmode="numeric" data-field="'+ei+":"+si+':rir" value="'+esc(set.rir)+'"></label></div>').join("")+'</section>'}
  function renderRunner(){const a=state.active;if(!a)return renderToday();const session=PROGRAM.sessions[a.session], p=phaseFor(a.week);$("#todayView").innerHTML='<article class="card hero runner-head"><div class="row between"><div><span class="eyebrow">In corso · settimana '+a.week+"/"+PROGRAM.weeks+'</span><h1>Seduta '+a.session+'</h1><p class="muted">'+esc(session.title)+' · '+esc(p.name)+'</p></div><strong id="timer" class="timer">00:00</strong></div><div class="row"><button class="button" id="saveDraft">Salva bozza</button><button class="button primary" id="checkout">Check-out</button></div></article><div class="runner-layout"><nav class="blocknav">'+session.blocks.map((b,i)=>'<button data-jump="'+i+'">'+(i+1)+". "+esc(b.name)+'</button>').join("")+'</nav><div class="stack">'+session.blocks.map(runnerBlock).join("")+'</div></div>';
    bindRunner();startTicker()
  }
  function bindRunner(){const a=state.active;$$("[data-check]").forEach(i=>i.onchange=()=>{a.checks[i.dataset.check]=i.checked;save();renderRunner()});$$("[data-set]").forEach(i=>i.onchange=()=>{const [e,s]=i.dataset.set.split(":").map(Number);a.strength["e"+e][s].done=i.checked;save()});$$("[data-field]").forEach(i=>i.oninput=()=>{const [e,s,k]=i.dataset.field.split(":");a.strength["e"+e][Number(s)][k]=i.value;save()});$$("[data-m3]").forEach(i=>i.oninput=()=>{const [b,k]=i.dataset.m3.split("-");a.m3[b]=a.m3[b]||{};a.m3[b][k]=i.value;save()});$$("[data-jump]").forEach(b=>b.onclick=()=>document.querySelector('[data-block="'+b.dataset.jump+'"]').scrollIntoView({behavior:"smooth",block:"start"}));$("#saveDraft").onclick=()=>{save();toast("Bozza salvata su questo dispositivo.")};$("#checkout").onclick=renderCheckout}
  function renderCheckout(){const a=state.active;if(!a)return;const s=PROGRAM.sessions[a.session], time=Math.max(1,Math.ceil((Date.now()-a.startedAt+a.elapsedBefore)/60000));$("#todayView").innerHTML='<article class="card hero"><span class="eyebrow">Check-out</span><h1>Registra la seduta '+a.session+'</h1><p class="muted">I dati restano sul dispositivo e possono essere esportati in JSON.</p></article><form id="checkoutForm" class="card stack"><div class="formgrid"><label>Data<input id="recordDate" type="date" value="'+today()+'"></label><label>Durata (minuti)<input id="recordDuration" type="number" min="1" value="'+time+'"></label>'+s.metrics.map(m=>'<label>'+esc(m[1])+'<input id="metric-'+m[0]+'" type="'+m[2]+'" placeholder="'+esc(m[3]||"")+'" value="'+esc(a.metrics[m[0]]||"")+'"></label>').join("")+'<label class="wide">Nota della sessione<textarea id="recordNote" placeholder="tecnica, adattamenti, recupero, qualsiasi cosa utile…">'+esc(a.note||"")+'</textarea></label></div><div class="notice">Concludendo, la prossima seduta proposta sarà <strong>'+nextOf(a.session)+'</strong>. Puoi correggerla in qualunque momento.</div><div class="row"><button class="button primary" type="submit">Salva nel diario</button><button class="button" type="button" id="backRunner">Torna alla seduta</button></div></form>';
    $("#backRunner").onclick=renderRunner;$("#checkoutForm").onsubmit=e=>{e.preventDefault();s.metrics.forEach(m=>a.metrics[m[0]]=$("#metric-"+m[0]).value);a.note=$("#recordNote").value;const rec={schemaVersion:1,id:a.id,date:$("#recordDate").value||today(),savedAt:new Date().toISOString(),session:a.session,week:a.week,phase:phaseFor(a.week).name,duration:Number($("#recordDuration").value)||0,checks:a.checks,strength:a.strength,metrics:a.metrics,m3:a.m3,note:a.note,programVersion:APP.programVersion};state.records=[rec,...state.records.filter(r=>r.id!==rec.id)];state.config.nextSession=nextOf(a.session);state.active=null;save();toast("Seduta salvata nel diario.");setView("journal")}}
  function renderPlan(){const w=currentWeek();$("#planView").innerHTML='<article class="card hero"><span class="eyebrow">Programma fissato</span><h1>Ciclo di 18 settimane</h1><p class="muted">Settimana attuale: '+w+" · "+esc(phaseFor(w).name)+'</p></article><article class="card"><h2 class="section-title">Progressione</h2><div class="timeline">'+PROGRAM.phases.map(p=>'<div class="phase"><b>'+esc(p.weeks)+'</b><div><strong>'+esc(p.name)+'</strong><div class="muted">'+esc(p.note)+'</div></div></div>').join("")+'</div></article><article class="card"><h2 class="section-title">Sedute A–D</h2>'+PROGRAM.sequence.map(s=>planSession(s)).join("")+'</article><article class="card"><h2 class="section-title">Gate essenziali</h2><details><summary>Pike handstand</summary><div class="detailsbody">Wall tuck slide 3 × 5, almeno 5/6 straight↔tuck e wall pike 3 × 20″ senza compensazione evidente prima di introdurre straight→pike parziale.</div></details><details><summary>Pike push-up → HSPU</summary><div class="detailsbody">Dopo 4 × 8 pulite con circa 2 RIR in due esposizioni: elevazione o deficit. Partial/negative wall HSPU sostituiscono la pike push-up pesante, non si sommano.</div></details><details><summary>Press preparation</summary><div class="detailsbody">P0→P1 dopo due settimane verdi e float filmato; P1→P2 dopo 4 × 12″ ripetibili e discesa assistita controllata.</div></details></article>'}
