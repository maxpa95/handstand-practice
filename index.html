const HELP={

function startNotice(c,e){let h='';if(c.session==='A'&&c.mode.startsWith('E')){h='<div class="notice"><strong>'+modes[c.mode]+'</strong><p>'+HELP[c.mode][1]+'</p><p class="small">Ultima endurance: '+(e.last?esc(e.last.date):'nessuna registrata')+'. '+(!e.eligible?'Attendi almeno sette giorni: oggi usa Normale.':'Una sola modalità, senza altri blocchi di tenute.')+'</p>'+(!state.config.endurance||state.config.endurance==='none'?'<p class="bad">Seleziona prima il bersaglio endurance in Dati, dopo osservazione delle cause di uscita.</p>':'')+'<label class="checkline"><input id="reason" type="checkbox" '+(c.reason?'checked':'')+'>Ho osservato questo limite in due A normali; il modulo corrisponde al problema.</label><label class="checkline"><input id="ready" type="checkbox" '+(c.ready?'checked':'')+'>La calibrazione abituale è tollerata; oggi niente test, press o fastidio crescente.</label></div>';}else if(c.session==='A')h='<div class="notice">'+HELP[c.mode][1]+'</div>';else if(c.session==='B')h='<p class="notice">Tuck: '+(state.config.tuck==='wall'?'equilibrio schiena al muro':'transizioni straight ↔ tuck')+'. Le pause nelle entrate sono già pratica della tenuta; niente negative aggiuntive.</p><label class="checkline"><input id="tuckGate" type="checkbox">Oggi verifico P0: tre serie di slides sostituiscono le due normali.</label>';else if(c.session==='C')h='<p class="notice">'+PIKE[state.config.pikeLevel][0]+': '+PIKE[state.config.pikeLevel][1]+'. Nessuna negativa di press nel blocco base.</p>';if(c.mob==='pike'&&c.session==='C')h+='<p class="small muted">Pike dopo lower: se posteriori già affaticati, sposta il modulo a una seduta dedicata oppure ometti; non forzare il range dopo l’hinge.</p>';if(c.mobDose==='full')h+='<p class="small warning">Il template completo, soprattutto Pike, può superare 40 minuti. La dose non aumenta automaticamente con la frequenza.</p>';return h;}
function startSession(){if(state.active)return;const c=choice||newChoice(),conf=state.config;if(c.session==='A'&&c.mode==='E3'){const issue=startIssue(c);if(issue){showStartIssue(issue);return;}conf.maxHold=c.maxHold;conf.maxDate=c.maxDate;}if(c.session==='M'&&c.mob==='none'){showStartIssue('Scegli Pike o Pancake per una seduta di sola mobilità.');return;}if(c.session==='A'&&c.mode.startsWith('E')){const issue=startIssue(c);if(issue){showStartIssue(issue);return;} conf.endurance=c.mode;if(c.mode==='E3'&&(!(Number(conf.maxHold)>0)||!Number.isFinite(dateNumber(conf.maxDate))||daysBetween(day(),conf.maxDate)<0||daysBetween(day(),conf.maxDate)>42)){showStartIssue('Per E3 registra qui un massimo verificato negli ultimi 42 giorni oppure scegli Verifica straight.');return;}}
 const mode=c.session==='A'?c.mode:'skill',deload=Boolean(conf.endDeload),rows=mode==='E2'?5:mode==='E3'?Number(conf.endSets):mode==='test'?3:0,n=deload&&mode.startsWith('E')?Math.floor(rows/2):rows;
 const hs={mode,pikeLevel:conf.pikeLevel,tuck:conf.tuck,straddle:conf.straddle,tuckGate:c.tuckGate,deload,referenceMax:conf.maxHold,referenceDate:conf.maxDate,target:mode==='E3'?Math.max(1,Math.floor(Number(conf.maxHold)*Number(conf.endPercent)/100*(deload?.7:1))):mode==='E1'?(deload?84:120):'',assistTarget:deload?7:10,rest:mode==='E3'?Number(conf.endRest):mode==='test'?180:mode==='E2'?150:90,rows:Array.from({length:n},()=>({seconds:'',assisted:'',rest:'',cause:'',attempted:false})),metrics:{},notes:''};
 const strength={};for(const f of F[c.session]||[]){const p=conf.exercisePrefs[c.session+':'+f.id]||{};strength[f.id]={slot:f.name,name:p.name||f.options[0],prescription:p.prescription||f.sets+' × '+f.reps,setup:p.setup||'',environment:p.environment==='gym'?'gym':'home',note:f.note,rest:f.rest,options:f.options,optional:!!f.optional,sets:Array.from({length:f.sets},()=>({load:'',reps:'',variant:'',setup:'',done:false}))};}
 const tasks=hsTasks(c.session,hs),m=c.mob==='none'?null:{key:c.mob,phase:Number(conf[c.mob+'Phase'])===2?2:1,dose:c.mobDose,status:'none',note:'',items:m3Items(c.mob,Number(conf[c.mob+'Phase'])===2?2:1,c.mobDose)};
 state.active={id:uid(),origin:'casa',programVersion:APP.programVersion,session:c.session,sessionName:labels[c.session],date:day(),week:week(),phase:phase(week()),createdAt:new Date().toISOString(),timer:{elapsedMs:0,running:true,startedAt:Date.now()},checks:{},strength,hs,tasks,mobility:m,note:''};choice=null;finish=false;save();renderToday();}
function taskList(items,prefix,a){return items.map(t=>'<div class="task '+(a.checks[prefix+t.id]?'checked':'')+'"><input aria-label="Completato: '+esc(t.name)+'" type="checkbox" data-check="'+prefix+t.id+'" '+(a.checks[prefix+t.id]?'checked':'')+'><div class="copy"><strong>'+esc(t.name)+'</strong><span class="dose">'+esc(t.dose)+'</span><small>'+esc(t.note)+'</small>'+(t.help?guideButton(t.help):'')+'</div></div>').join('');}
function strengthCard(k,e){return '<article class="exercise"><div class="exercisehead"><div class="labelrow"><strong>'+esc(e.slot)+'</strong>'+(e.optional?'<span class="pill">Facoltativo</span>':'')+'</div><p class="small muted">'+esc(e.note)+' Recupero '+esc(e.rest)+'.</p><div class="grid">'+select('Consigliati per',e.environment||'home',{home:'Casa',gym:'Palestra'},'data-environment="'+k+'"')+'<label class="field">Alternative consigliate<select data-recommend="'+k+'">'+recommendationOptions(state.active.session,k,e)+'</select></label>'+field('Esercizio svolto · modificabile liberamente',e.name,'data-ex="'+k+':name"')+field('Prescrizione scelta',e.prescription,'data-ex="'+k+':prescription"')+'<label class="field span2">Setup / attrezzi / ROM<input data-ex="'+k+':setup" value="'+esc(e.setup)+'" placeholder="Es. Australian: ginocchia piegate, piedi sul segno; floor press: 2 × 12 kg"></label></div><p class="small muted">Una sola alternativa per blocco. Cambiare Casa/Palestra aggiorna i suggerimenti, non il lavoro già scritto. Controlla la prescrizione scelta: macchine, pesi e corpo libero non sono equivalenti. Varianti unilaterali: ripetizioni per lato. Usa rialzi e ancoraggi solo se stabili.</p></div><div class="exercisebody">'+e.sets.map((s,i)=>'<div class="setrow"><span class="setnum">'+(i+1)+'</span>'+field('Carico aggiunto · kg',s.load,'inputmode="decimal" data-set-field="'+k+':'+i+':load"')+field('Ripetizioni',s.reps,'inputmode="numeric" data-set-field="'+k+':'+i+':reps"')+'<label class="done"><input type="checkbox" data-done="'+k+':'+i+'" '+(s.done?'checked':'')+'>Fatta</label><details class="variant"><summary>Variante diversa in questa serie'+(s.variant?' · '+esc(s.variant):'')+'</summary>'+field('Esercizio della singola serie',s.variant,'data-set-field="'+k+':'+i+':variant" placeholder="Vuoto = esercizio del blocco"')+field('Setup della singola serie',s.setup,'data-set-field="'+k+':'+i+':setup"')+'</details></div>').join('')+'<div class="row settools"><button data-add-set="'+k+'">+ Serie</button><button data-remove-set="'+k+'">− Ultima serie vuota</button></div></div></article>';}
function hsForm(a){const h=a.hs;let fields='';if(a.session==='A')fields=field('Secondi liberi controllati nella finestra',h.metrics.controlled||'','data-metric="controlled" inputmode="numeric"')+field('Mediana delle 3 migliori · s',h.metrics.median||'','data-metric="median" inputmode="numeric"')+field('Migliore tenuta calma · s',h.metrics.calm||'','data-metric="calm" inputmode="numeric"');else if(a.session==='B')fields=field('Tuck: ingressi buoni / tentati',h.metrics.tuck||'','data-metric="tuck" placeholder="6 / 8"')+field('Tuck: migliore tenuta libera · s',h.metrics.tuckBest||'','data-metric="tuckBest" inputmode="numeric"')+field('Cicli completi per serie',h.metrics.cycles||'','data-metric="cycles" placeholder="2 / 2 / 1"');else fields=field('Straddle: ingressi buoni / tentati',h.metrics.straddle||'','data-metric="straddle" placeholder="5 / 6"')+field('Straddle: cicli completi per serie',h.metrics.cycles||'','data-metric="cycles"')+field('Pike: secondi / cicli per serie',h.metrics.pike||'','data-metric="pike" placeholder="15 / 15 / 12 s"')+field('Pike: angolo sopra orizzontale',h.metrics.angle||'','data-metric="angle" placeholder="30°"')+field('Distanza mani–muro / appoggio',h.metrics.setup||'','data-metric="setup"');return '<details class="flat" open><summary>Registra il lavoro sulle mani</summary><div class="inside"><div class="grid">'+fields+'</div><p class="small muted">Le spunte descrivono il lavoro svolto; i risultati servono a decidere le progressioni.</p><div id="hsRows">'+hsRows(h)+'</div>'+((h.mode==='normal'||h.mode==='E1')?'<button id="addHold">+ Registra una tenuta</button>':'')+'<label class="field" style="margin-top:.8rem">Osservazioni / motivo prevalente delle uscite<textarea data-hs-note>'+esc(h.notes)+'</textarea></label></div></details>';}
function hsRows(h){return h.rows.map((r,i)=>'<div class="exercise"><div class="exercisebody"><strong>Tenuta '+(i+1)+(h.mode==='E3'?' · target '+h.target+' s':'')+'</strong><div class="grid three">'+field('Secondi liberi',r.seconds,'data-hold="'+i+':seconds" inputmode="numeric"')+(h.mode==='E2'?field('Secondi assistiti',r.assisted,'data-hold="'+i+':assisted" inputmode="numeric"'):'')+field('Recupero effettivo · s',r.rest,'data-hold="'+i+':rest" inputmode="numeric"')+select('Uscita',r.cause,{'':'Da annotare',equilibrio:'Correzione / equilibrio',push:'Perdita del push',volontaria:'Volontaria / target',ingresso:'Ingresso fallito',incerto:'Incerto'},'data-hold="'+i+':cause"')+'</div><label class="checkline"><input type="checkbox" data-hold-attempt="'+i+'" '+(r.attempted?'checked':'')+'>Tentativo effettuato</label></div></div>').join('');}
function progress(a){const taskIds=(a.session==='M'?[]:WARMUP.map((_,i)=>'w'+i)).concat(a.tasks.map(t=>'h'+t.id),a.mobility?.items.map(t=>'m'+t.id)||[]);const sets=Object.values(a.strength).flatMap(e=>e.sets);return {done:taskIds.filter(k=>a.checks[k]).length+sets.filter(s=>s.done).length,total:taskIds.length+sets.length};}
function renderRunner(){const a=state.active,p=progress(a);$('#today').innerHTML='<section class="console"><div class="row between"><div><strong>'+labels[a.session]+'</strong> <span class="pill blue">'+(a.session==='A'?modes[a.hs.mode]:a.session==='C'?PIKE[a.hs.pikeLevel][0]:'Seduta in corso')+'</span><p id="storageStatus" class="small muted"></p></div><div class="row"><span id="clock" class="timer">'+fmt(elapsed())+'</span><button id="pause">'+(a.timer.running?'Pausa':'Riprendi')+'</button><button class="primary" id="finishBtn">Termina</button></div></div><div class="progress"><i id="progressFill" style="width:'+(p.total?100*p.done/p.total:0)+'%"></i></div><span id="progressText" class="tiny muted">'+p.done+' / '+p.total+' completati · puoi salvare una seduta parziale</span></section><nav class="blocks">'+(a.session==='M'?'':'<a href="#warmBlock">Warm-up</a><a href="#hsBlock">Handbalancing</a><a href="#strengthBlock">Forza</a>')+(a.mobility?'<a href="#mobBlock">'+a.mobility.key+' M3</a>':'')+'</nav><div class="stack">'+(a.session==='M'?'':('<article id="warmBlock" class="card block"><h2>Warm-up personale</h2>'+taskList(WARMUP.map((x,i)=>task(String(i),x[0],x[1].replace(/ Palestra:[\s\S]*/,''))),'w',a)+'</article><article id="hsBlock" class="card block"><div class="row between"><h2>Handbalancing</h2><span class="pill">'+(a.session==='A'?'20–25 min':'Tetto 30 min')+'</span></div><p class="small muted">Due errori consecutivi: pausa e regressione. Se anche i due successivi sono incontrollati, chiudi il blocco.</p>'+taskList(a.tasks,'h',a)+hsForm(a)+'</article><article id="strengthBlock" class="card block"><h2>Forza · '+labels[a.session]+'</h2><p class="small muted">Scegli dal menu di suggerimenti o scrivi liberamente. kg = carico esterno totale; corpo libero = 0. Elastico e geometria vanno nel setup. Gli accessori facoltativi lasciano spazio alla mobilità.</p>'+Object.entries(a.strength).map(([k,e])=>strengthCard(k,e)).join('')+'</article>'))+(a.mobility?'<article id=" function countSets(r){return Object.values(r.strength||{}).reduce((n,e)=>n+(e.sets||[]).filter(s=>s.done).length,0);}
function strengthReview(r){return Object.values(r.strength||{}).map(e=>'<div class="entry"><strong>'+esc(e.name||e.slot)+'</strong><p class="small muted">'+esc(e.prescription||'')+(e.setup?' · '+esc(e.setup):'')+'</p><div class="tablewrap"><table><thead><tr><th>Serie</th><th>'+ (r.legacy?'Carico originale':'kg aggiunti')+'</th><th>Reps</th><th>Variante / note</th><th>Stato</th></tr></thead><tbody>'+(e.sets||[]).map((s,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(s.load??'—')+'</td><td>'+esc(s.reps??'—')+'</td><td>'+esc([s.variant,s.setup,s.rir!==undefined&&s.rir!==''?'RIR originale: '+s.rir:''].filter(Boolean).join(' · '))+'</td><td>'+(s.done?'Fatta':logged(s)?'Annotata':'Non segnata')+'</td></tr>').join('')+'</tbody></table></div></div>').join('')||'<p class="muted">Nessuna forza registrata.</p>';}
function renderFinish(){const a=state.active;if(!a)return renderToday();const m=a.mobility,mc=m?m.items.filter(t=>a.checks['m'+t.id]).length:0;const status=mc?(mc===m.items.length?'done':'partial'):'none';$('#today').innerHTML='<div class="stack"><article class="card hero"><span class="eyebrow">Fine seduta · timer in pausa</span><h1>'+labels[a.session]+'</h1><p>'+countSets(a)+' serie di forza completate · '+fmt(elapsed())+'</p><button id="backRun">Torna alla seduta</button></article><form id="finishForm" class="card stack"><div class="grid">'+field('Data',a.date,'id="recordDate" required','date')+field('Durata da registrare · minuti',a.duration??Math.max(1,Math.round(elapsed()/60000)),'id="duration" min="1" required','number')+(m?select('Mobilità svolta',m.reviewStatus||status,{none:'Non svolta',partial:'Parziale',done:'Dose scelta completata'},'id="mobStatus"'):'')+'</div>'+(m?'<p class="small muted">'+mc+' / '+m.items.length+' esercizi spuntati · '+doses[m.dose]+'. Conferma la dose effettivamente svolta.</p>':'')+'<label class="field">Nota finale<textarea id="finalNote">'+esc(a.note)+'</textarea></label><div class="notice">'+(a.session==='M'?'Lo split di forza non avanza.':'Prossima forza: '+labels[nextOf(a.session)]+'.')+' La mobilità avanza solo se svolta almeno in parte.</div><button class="primary" type="submit">Salva e termina</button><p id="storageStatus" class="small muted"></p></form><details><summary>Riepilogo forza completo</summary><div class="inside">'+strengthReview(a)+'</div></details></div>';$('#backRun').onclick=()=>{finish=false;renderRunner();};$('#recordDate').oninput=e=>{a.date=e.target.value;save();};$('#duration').oninput=e=>{a.duration=e.target.value;save();};$('#finalNote').oninput=e=>{a.note=e.target.value;save();};if($('#mobStatus'))$('#mobStatus').onchange=e=>{m.reviewStatus=e.target.value;save();};$('#finishForm').onsubmit=e=>{e.preventDefault();const date=$('#recordDate').value,duration=Number($('#duration').value),st=$('#mobStatus')?.value||'none';if(!Number.isFinite(dateNumber(date))||daysBetween(day(),date)<0||!Number.isFinite(duration)||duration<=0){toast('Controlla data e durata; la data non può essere futura.');return;}if(st==='done'&&m&&mc!==m.items.length){confirmAction('Confermi la dose completata?','Non tutti gli esercizi sono spuntati. Il diario conserverà sia le spunte sia questa conferma.',()=>completeSession(date,duration,st));}else completeSession(date,duration,st);};}
function completeSession(date,duration,status){const a=state.active;if(!a)return;pause();const r=clone(a);r.date=date;r.duration=duration;r.timerSeconds=Math.round(elapsed(a)/1000);r.savedAt=new Date().toISOString();r.finishedAt=r.savedAt;delete r.timer;if(r.mobility)r.mobility.status=status;state.records.push(r);if(a.session!=='M'){state.config.nextSession=nextOf(a.session);for(const[k,e]of Object.entries(a.strength))state.config.exercisePrefs[a.session+':'+k]={name:e.name,setup:e.setup,prescription:e.prescription,environment:e.environment||'home'};}if(a.mobility&&status!=='none')state.config.nextMob=other(a.mobility.key);state.active=null;choice=null;finish=false;const ok=save();setView('journal');toast(ok?'Seduta salvata.':storageError);}
function renderPlan(){const sections='<div class="toc"><a href="#plan-split">Split e alternative</a> · <a href="#plan-mobility">Mobilità</a> · <a href="#plan-hs">Guida handbalancing</a></div>';$('#plan').innerHTML='<div class="stack"><article class="card hero"><span class="eyebrow">Piano · casa</span><h1>Cosa fare, quando e come</h1><p>Tre sedute di forza in rotazione. Un modulo Pike/Pancake a ogni allenamento, alternato indipendentemente dallo split.</p>'+sections+'</article><article class="card" id="plan-split"><h2>Forza: scegli dentro lo stesso compito</h2><p class="small">Volume rivisto per lasciare tempo alla mobilità: A 12 serie, B 14, C 14, inclusi 2 set facoltativi per seduta. Non devi aggiungere tutte le alternative. Mantieni variante e setup abbastanza stabili da confrontare le esposizioni.</p><p>Quando raggiungi il limite alto con controllo in due esposizioni comparabili, aumenta il minimo carico disponibile o modifica una sola leva. Con un esercizio diverso riparti dal suo riferimento. Niente incremento automatico da un record con setup diverso.</p>'+Object.entries(F).map(([s,items])=>'<details><summary>'+labels[s]+' · '+items.reduce((n,e)=>n+e.sets,0)+' serie prescritte</summary><div class="inside">'+items.map(e=>'<div class="entry"><strong>'+esc(e.name)+' · '+e.sets+' × '+esc(e.reps)+(e.optional?' · facoltativo':'')+'</strong><p><strong>Casa:</strong> '+recommended(s,e.id,'home').map(esc).join(' / ')+'</p><p><strong>Palestra:</strong> '+recommended(s,e.id,'gym').map(esc).join(' / ')+'</p><p class="small muted">'+esc(e.note)+' Recupero '+e.rest+'.</p></div>').join('')+'</div></details>').join('')+'<p class="small">Attrezzatura: sbarra/dip station, parallettes, 2 kettlebell da 12 kg, 2 manubri da 4 kg, cavigliere da 1 kg, elastici, cintura, gilet da 10 kg, blocco e tappetino. Le opzioni Casa usano questa attrezzatura; quelle Palestra richiedono gli attrezzi indicati. Il catalogo di forza è un adattamento personale, non un elenco di sostituzioni prescritto dai manuali M3/HF. Spinte con pesi/macchine non replicano il lavoro specifico dei pike push-up; calf seduto cambia enfasi rispetto a ginocchio esteso. Mantieni il compito specifico quando prioritario.</p><p class="small">Il core separato della vecchia scheda non è obbligatorio qui: compressione M3 e handbalancing restano nel programma, per ricavare tempo senza allungare ogni seduta.</p></article>'+mobilityPlan()+'<article class="card"><h2>Ciclo e recupero</h2><p>Il ciclo precedente resta impostato dal '+esc(state.config.cycleStart)+': settimana '+week()+' / 18. Settimane 9 e 18: scarico del ciclo personale di forza/handbalancing, non calendario M3; riduci serie e tentativi e non introdurre nuove varianti. Per lo scarico M3 usa i criteri del manuale descritti sopra. I livelli pike e le fasi M3 si cambiano soltanto dopo verifica, non seguendo il calendario.</p><p class="small">Obiettivo pratico: circa 90–120 minuti. Se manca tempo togli prima i due set facoltativi di forza, poi sposta il modulo di mobilità a una seduta dedicata o registra il lavoro come parziale. Non comprimere i recuperi per far rientrare il template nel tempo. Il lavoro lower e M3 si sommano nel carico delle gambe.</p></article><article id="plan-hs" class="card"><h2>Handbalancing: guida completa</h2><p class="notice">Le dosi del manuale e gli adattamenti personali sono distinti nella guida. Nel runner viene mostrata una sola variante per ciascun compito.</p><div class="prose">'+$('#manual').innerHTML+'</div></article></div>';}
function mobilityPlan(){return '<article class="card" id="plan-mobility"><h2>Mobilità: una rotazione autonoma</h2><div class="tablewrap"><table><thead><tr><th>Allenamento</th><th>Forza (esempio)</th><th>Mobilità</th></tr></thead><tbody><tr><td>1</td><td>Push</td><td>Pike</td></tr><tr><td>2</td><td>Pull</td><td>Pancake</td></tr><tr><td>3</td><td>Lower</td><td>Pike</td></tr><tr><td>4, se disponibile</td><td>Push</td><td>Pancake</td></tr></tbody></table></div><p>Con tre giorni la settimana seguente riparte dal modulo opposto all’ultimo svolto. Se salti il modulo, resta proposto; non devi recuperare le serie saltate. Puoi scegliere «Solo mobilità» senza avanzare la forza.</p><p><strong>Prescrizione di riferimento:</strong> esegui le serie originali della fase selezionata, riportate sotto e nella seduta. Non è prevista una progressione generale «una serie → due serie». Pike L1: calf 1 serie, coppia B 2 serie, coppia C 3 serie. Pancake L1: coppia A 2 serie, coppia B 3 serie.</p><p>Il programma combinato M3 originale alterna A/B per 2–4 sedute totali a settimana e usa fasi di sei settimane. Le sei settimane si riferiscono alla fase del programma combinato; il passaggio resta manuale dopo retest, non automatico. Inserire M3 dopo la forza è una scelta personale e richiede di considerare anche quel carico.</p><p class="small">Nelle coppie A1/A2, B1/B2 o C1/C2 alterna una serie per esercizio e completa la coppia prima di passare alla lettera successiva. Tempo a quattro cifre = eccentrica, pausa, concentrica, pausa. Mantieni margine: in generale 2–3 reps; per i singoli isometrici usa il riferimento della tabella originale sotto.</p>'+['pike','pancake'].map(k=>'<details><summary>'+M3[k].title+' · dosi originali e riferimenti</summary><div class="inside">'+[1,2].map(p=>'<h3>Fase '+p+'</h3>'+M3[k]['phase'+p].map(x=>'<div class="entry"><strong>'+esc(x[0]+' · '+x[1])+'</strong><p>'+esc(x[2])+'</p><p class="small muted">'+esc(x[3])+' · '+esc(x[4].replace(/Settimane 1-2: 2 serie\. ?/g,''))+'</p></div>').join('')).join('')+'</div></details>').join('')+'<p class="small">RIR/DIR originali M3 L1: calf stretch 30–40 s DIR; hip flexor raises 2–3 RIR; rotazione interna supina 5 s DIR; block crush e good morning 2–3 RIR; horse stance hold 5–10 s DIR. Fase 2: lateral hamstring stretch 3–5 RIR, tailor press-down 2–3 s DIR, horse stance good morning 2 RIR. Seated compressions CQI e tailor lifts: 2–3 RIR. RIR = ripetizioni in riserva; DIR = durata in riserva, in secondi.</p><h3>Tempo limitato, recupero e scarico</h3><p>Calf stretch: il solo angolo neutro è una scorciatoia esplicitamente ammessa dal template se manca tempo; annotala. Per il resto, una seduta interrotta va registrata come parziale, indicando serie, tempi e motivo: non è un nuovo template ridotto. Una spunta di esercizio indica tutte le serie prescritte, non soltanto una.</p><p>Il manuale richiede di adattare il volume al carico complessivo di forza, sport e recupero (p. 39). Lo scarico è temporaneo, non il default: pp. 43–45 descrivono dimezzare le serie arrotondando per difetto e portare le tenute a circa il 60%; oppure ridurre la profondità a circa il 75% mantenendo serie e ripetizioni. Sono opzioni alternative, non da sommare automaticamente. Il manuale contempla anche una settimana di pausa o stretching rilassato; indica generalmente 4–8 settimane di lavoro prima di una settimana di scarico, con autoregolazione per chi è esperto.</p><p>Se applichi uno scarico, annota metodo e lavoro effettivo: questa versione lo registra come parziale rispetto al template, senza fingere il completamento del volume standard. Non viene imposto dalle settimane dello split di forza.</p><p class="small muted">Fonti: manuale M3 Pancake–Pike, PDF pp. 39, 43–45; Program Templates, PDF pp. 2–3, 5–6, 15–16. Le routine assumono familiarità con gli esercizi M3 già praticati. Per la tecnica usa le dimostrazioni originali del corso.</p></article>';}
const METRIC_NAMES={controlled:'Secondi controllati',median:'Mediana 3 migliori · s',calm:'Migliore calma · s',endurance:'Endurance',tuck:'Tuck buoni/tentati',tuckBest:'Migliore tuck · s',tuckGood:'Tuck riusciti',tuckTotal:'Tuck tentati',tuckNote:'Nota tuck',straddle:'Straddle buoni/tentati',straddleGood:'Straddle riusciti',straight:'Straight buoni/tentati',straightGood:'Straight riusciti',pike:'Pike',pikeLevel:'Variante pike',pikeSuccess:'Successi pike',cycles:'Cicli per serie',angle:'Angolo pike',setup:'Setup pike'};
function metricsReview(r){const metrics=r.hs?.metrics||r.metrics||{};return '<div class="entry">'+Object.entries(metrics).filter(([,v])=>v!=='').map(([k,v])=>'<p><span class="muted">'+esc(METRIC_NAMES[k]||k)+':</span> '+esc(v)+'</p>').join('')+(r.hs?'<p>'+esc(modes[r.hs.mode]||'Skill')+(r.hs.deload?' · deload':'')+'</p><p class="small">'+esc(r.hs.notes)+'</p>'+r.hs.rows.filter(s=>s.attempted||s.seconds!==''||s.cause).map((s,i)=>'<p class="small">Tenuta '+(i+1)+': '+esc(s.seconds||'0')+' s liberi'+(s.assisted!==''?' + '+esc(s.assisted)+' s assistiti':'')+' · '+esc(s.cause||'causa non annotata')+' · recupero '+esc(s.rest||'—')+' s</p>').join(''):'')+'</div>';}
function checklistReview(r){let rows=[];if(r.legacy){for(const[k,v]of Object.entries(r.checks||{})){const m=k.match(/^b(\d+)t(\d+)$/);if(!m)continue;const b=r.legacySession?.blocks?.[+m[1]];let items=b?.name==='Warm-up'?r.legacyWarmup:b?.items;if(b?.kind==='m3'&&b.m3Key){const key=b.m3Key;items=(r.legacyM3||M3)[key]?.['phase'+(r.m3Phases?.[key]||1)]?.map(x=>[x[0]+' · '+x[1]]);}rows.push({name:(b?.name||'Blocco '+m[1])+': '+(items?.[+m[2]]?.[0]||k),done:v});}}else{rows=(r.tasks||[]).map(t=>({name:t.name,done:r.checks?.['h'+t.id]})).concat(r.mobility?.items.map(t=>({name:t.name,done:r.checks?.['m'+t.id]}))||[]);}return rows.map(x=>'<p class="small">'+(x.done?'✓ ':'○ ')+esc(x.name)+'</p>').join('');}
function mobilityReview(r){const m=mobilityOf(r);return '<p>'+(m?esc(m.key)+' · '+(m.status==='done'?'dose completata':'parziale')+(m.dose==='legacy'?' · da spunte storiche':' · '+esc(doses[m.dose]||m.dose)):'Nessuna mobilità documentata')+'</p>'+(r.mobility?'<p class="small">'+esc(r.mobility.note)+'</p>':'')+Object.values(r.blockNotes||{}).filter(Boolean).map(v=>'<p>'+esc(v)+'</p>').join('')+(r.m3&&Object.keys(r.m3).length?'<pre>'+esc(JSON.stringify(r.m3,null,2))+'</pre>':'');}
let filters={origin:'',session:'',from:'',to:''};
function filteredRecords(){return state.records.filter(r=>(!filters.origin||r.origin===filters.origin)&&(!filters.session||r.session===filters.session)&&(!filters.from||r.date>=filters.from)&&(!filters.to||r.date<=filters.to)).sort((a,b)=>b.date.localeCompare(a.date));}
function recordsHtml(records){if(!records.length)return'<p class="empty">Nessuna seduta per questi filtri.</p>';return records.map(r=>'<article class="card"><div class="row between"><div><span class="eyebrow sourcebadge">'+esc(origins[r.origin]||r.origin)+'</span><h2>'+esc(r.date)+' · '+esc(r.sessionName||r.legacySession?.title||labels[r.session])+'</h2></div><span class="pill">'+esc(r.duration)+' min · '+countSets(r)+' serie fatte</span></div><p class="small">'+esc(r.note||'')+'</p><details class="recorddetails"><summary>Apri tutti i dettagli</summary><div class="inside">'+(r.legacy?'<p class="notice small">Storico originale. I nomi prescritti possono differire dall’esercizio svolto; testi nei campi carico/RIR sono conservati senza reinterpretarli.</p>':'')+'<h3>Handbalancing</h3>'+metricsReview(r)+'<h3>Forza</h3>'+strengthReview(r)+'<h3>Mobilità</h3>'+mobilityReview(r)+'<details><summary>Checklist e campi originali</summary><div class="inside">'+checklistReview(r)+'<details><summary>Record completo</summary><div class="inside"><pre>'+esc(JSON.stringify(r,null,2))+'</pre></div></details></div></details><div class="row" style="margin-top:1rem"><button data-record-export="'+esc(recordKey(r))+'">Esporta questa seduta</button><button class="danger" data-trash="'+esc(recordKey(r))+'">Sposta nel cestino</button></div></div></details></article>').join('');}
function renderJournal(){const v3=state.records.filter(r=>r.origin==='v3').length,ppl=state.records.filter(r=>r.origin==='ppl').length;$('#journal').innerHTML='<div class="stack"><article class="card hero"><span class="eyebrow">Diario unificato</span><h1>'+state.records.length+' allenamenti</h1><p class="muted">'+v3+' fullbody V3 · '+ppl+' PPL precedenti · '+state.records.filter(r=>r.origin==='casa').length+' Casa</p><div class="grid">'+select('Programma',filters.origin,{'':'Tutti',...origins},'id="filterOrigin"')+select('Seduta',filters.session,{'':'Tutte',A:'A',B:'B',C:'C',D:'D · solo V3',M:'Solo mobilità'},'id="filterSession"')+field('Dal',filters.from,'id="filterFrom"','date')+field('Al',filters.to,'id="filterTo"','date')+'</div></article><div class="stack" id="records">'+recordsHtml(filteredRecords())+'</div></div>';for(const[id,k]of [['filterOrigin','origin'],['filterSession','session'],['filterFrom','from'],['filterTo','to']])$('#'+id).oninput=e=>{filters[k]=e.target.value;$('#records').innerHTML=recordsHtml(filteredRecords());};}
function renderSettings(){const c=state.config;$('#settings').innerHTML='<div class="stack"><article class="card hero"><span class="eyebrow">Dati e preferenze</span><h1>Il tuo programma</h1><p class="muted">I dieci allenamenti iniziali sono inclusi nel file. Le nuove sedute restano in questo browser: esporta JSON per trasferirle o proteggerle.</p><p id="storageStatus"></p><div class="row"><button class="primary" id="export">Esporta backup JSON</button><button id="csv">Esporta CSV</button><label class="button">Importa backup<input type="file" accept=".json,application/json" id="import" hidden></label></div><p class="small">Importa V3, PPL o Casa: unisce le sedute per identità senza sovrascrivere quelle esistenti. Puoi ripristinare impostazioni e bozza solo da un backup Casa.</p><label class="checkline"><input type="checkbox" id="restoreConfig">Ripristina anche impostazioni e bozza Casa (solo se non c’è una seduta aperta)</label></article><form id="settingsForm" class="card stack"><h2>Rotazione e livelli</h2><p class="small">Le modifiche valgono dalla prossima seduta; la bozza aperta conserva la sua prescrizione.</p><div class="grid">'+field('Inizio del ciclo precedente',c.cycleStart,'id="cycleStart" required','date')+select('Prossima forza',c.nextSession,{A:labels.A,B:labels.B,C:labels.C},'id="nextSession"')+select('Prossima mobilità',c.nextMob,{pike:'Pike',pancake:'Pancake'},'id="nextMob"')+'<input type="hidden" id="mobDose" value="full"><p class="small">Mobilità: serie del template M3 originale. Nessuna progressione automatica da una a due serie.</p>'+select('Tuck: variante',c.tuck,{transition:'Straight ↔ tuck',wall:'Wall tuck · schiena al muro'},'id="tuck"')+select('Straddle: variante',c.straddle,{transition:'Straight ↔ straddle',wall:'Wall straddle · petto al muro'},'id="straddle"')+select('Livello pike',c.pikeLevel,Object.fromEntries(PIKE.map((p,i)=>[i,p[0]])),'id="pikeLevel"')+select('Fase Pike M3',c.pikePhase,{1:'Level 1 · fase 1',2:'Level 1 · fase 2'},'id="pikePhase"')+select('Fase Pancake M3',c.pancakePhase,{1:'Level 1 · fase 1',2:'Level 1 · fase 2'},'id="pancakePhase"')+'</div><div class="notice"><strong>Conferma prima di avanzare</strong><p class="small">'+PIKE[c.pikeLevel][3]+' Cambiare livello è una decisione manuale basata sulle esposizioni: una spunta di completamento non basta.</p><label class="checkline"><input type="checkbox" id="gate1">Prima esposizione: criterio soddisfatto</label><label class="checkline"><input type="checkbox" id="gate2">Seconda esposizione distinta: criterio soddisfatto</label><label class="checkline"><input type="checkbox" id="m3Gate">Se cambio fase M3: ho confrontato range, controllo e tolleranza nel retest</label></div><h2>Endurance</h2><p class="small">Default: nessun modulo. Dopo due A normali, scegli la causa ricorrente. Il limite di sette giorni è controllato all’avvio.</p><div class="grid">'+select('Bersaglio osservato',c.endurance,{none:'Da valutare · solo normale',E1:modes.E1,E2:modes.E2,E3:modes.E3},'id="endurance"')+field('Massimo straight pulito verificato · s',c.maxHold,'id="maxHold" min="1"','number')+field('Data della verifica',c.maxDate,'id="maxDate"','date')+field('E3: serie (10–15)',c.endSets,'id="endSets" min="10" max="15" required','number')+field('E3: percentuale (50–60)',c.endPercent,'id="endPercent" min="50" max="60" required','number')+field('E3: recupero (45–60 s)',c.endRest,'id="endRest" min="45" max="60" required','number')+'</div><label class="checkline"><input id="endDeload" type="checkbox" '+(c.endDeload?'checked':'')+'>Deload endurance: metà serie e 70% target; retest nella settimana successiva</label><p class="small muted">Per E2 in deload, il tratto libero va mantenuto submassimale rispetto alle ultime esposizioni. Per E1 riduciamo il totale, senza ricerca del minor numero di serie.</p><button class="primary" type="submit">Salva impostazioni</button></form><article class="card"><h2>Cestino e bozze archiviate</h2><p class="small">Le cancellazioni sono recuperabili. Una bozza V3 vuota con timer aperto è archiviata: non conta come allenamento e non viene avviata.</p>'+state.trash.map(r=>'<div class="entry row between"><span>'+esc(r.date)+' · '+esc(origins[r.origin])+'</span><button data-restore="'+esc(recordKey(r))+'">Ripristina</button></div>').join('')+'<p>'+state.archivedDrafts.length+' bozze archiviate nel backup.</p><button id="exportDrafts">Esporta bozze archiviate</button><details><summary>Consulta le bozze archiviate</summary><div class="inside">'+state.archivedDrafts.map((a,i)=>'<details><summary>'+esc(origins[a.origin]||a.origin)+' · bozza '+(i+1)+'</summary><div class="inside"><pre>'+esc(JSON.stringify(a.draft,null,2))+'</pre></div></details>').join('')+'</div></details></article></div>';$('#export').onclick=exportBackup;$('#csv').onclick=()=>download('handstand-casa-diario.csv',csv(),'text/csv;charset=utf-8');$('#exportDrafts').onclick=()=>download('handstand-bozze-archiviate.json',JSON.stringify(state.archivedDrafts,null,2),'application/json');$('#import').onchange=e=>importFile(e.target.files[0],$('#restoreConfig').checked);$('#settingsForm').onsubmit=e=>{e.preventDefault();const level=Number($('#pikeLevel').value);if(level>c.pikeLevel&&(level!==c.pikeLevel+1||!$('#gate1').checked||!$('#gate2').checked)){toast('Avanza un solo livello, dopo due esposizioni confermate.');return;}if((Number($('#pikePhase').value)>c.pikePhase||Number($('#pancakePhase').value)>c.pancakePhase)&&!$('#m3Gate').checked){toast('Conferma il retest prima di avanzare la fase M3.');return;}for(const k of ['cycleStart','nextSession','nextMob','mobDose','tuck','straddle','endurance','maxHold','maxDate'])c[k]=$('#'+k).value;for(const k of ['pikeLevel','pikePhase','pancakePhase','endSets','endPercent','endRest'])c[k]=Number($('#'+k).value);c.endDeload=$('#endDeload').checked;if($('#gate1').checked&&$('#gate2').checked)c.gateChecks[level]={confirmedAt:day(),exposures:2};choice=null;save();toast('Impostazioni salvate per le prossime sedute.') function trackRecords(k){const tr=state.config.progress.tracks[k];return state.records.filter(r=>r.v2&&r.hs?.epochs?.[k]===tr.epoch&&r.hs?.stages?.[k]===tr.stage&&r.tasks?.some(t=>t.measure?.track===k)&&daysBetween(day(),r.date)>=0&&daysBetween(day(),r.date)<=42).sort((a,b)=>b.date.localeCompare(a.date)||String(b.savedAt).localeCompare(String(a.savedAt))).filter((r,i,rs)=>rs.findIndex(x=>x.date===r.date)===i).slice(0,2);}

renderPlan=()=>{
 $('#plan').innerHTML='<div class="stack"><article class="card hero"><h1>Casa V2 · PPL completo</h1><p>Rotazione continua Push → Pull → Lower; Pike ↔ Pancake indipendente. Volume del PPL precedente ripristinato: forza 20 / 20 / 18 serie, core in A/B, tenute tuck dedicate. Durata orientativa 110–150+ minuti con M3 completo: non è un limite garantito.</p><p>Il volume PPL e l’integrazione sono personali. HF/M3 guidano tecnica, dosi dei moduli e progressioni. Nessuna equivalenza presunta fra compressione M3 e core eliminato.</p></article>'+['A','B','C'].map(s=>{const h={stages:Object.fromEntries(Object.entries(state.config.progress.tracks).map(([k,v])=>[k,v.stage])),mode:'normal',press:state.config.progress.press};return '<article class="card"><h2>'+s+' · '+labels[s]+'</h2><h3>Handstand</h3>'+hsTasks(s,h).map(t=>'<p><strong>'+esc(t.name)+'</strong> · '+esc(t.dose)+'</p><p class="small">'+esc(t.note)+'</p>').join('')+'<h3>Forza</h3>'+F[s].map(f=>'<p>'+esc(f.name)+' · '+f.sets+' × '+esc(f.reps)+' · recupero '+esc(f.rest)+'</p>').join('')+'<h3>Core</h3>'+(CORE[s].map(c=>'<p>'+esc(c.name)+' · '+c.dose+'</p><p class="small">'+esc(c.note)+'</p>').join('')||'<p>Nessun blocco separato in C.</p>')+'</article>';}).join('')+mobilityPlanV2()+'<article class="card" id="plan-hs"><h2>Guida tecnica</h2><p>Fonti principali: Keep Pushing pp. 16–20, 43–55, 60–61; Push Refining template pp. 2–5; High Press template p. 2 e Press pp. 25, 41. Le dosi PPL e i criteri numerici di conferma sono adattamenti personali.</p>'+Object.values(HELP).filter((h,i,all)=>all.findIndex(x=>x[2]===h[2])===i).map(h=>'<section id="guide-'+esc(h[2])+'"><h3>'+esc(h[0])+'</h3><p>'+esc(h[1])+'</p></section>').join('')+'</article><article class="card"><h2>Progressioni e registrazione</h2><p>Ogni blocco conserva istruzioni, dose, variante e risultati. Le ultime due esposizioni in giorni diversi, entro 42 giorni e con lo stesso setup, alimentano la proposta handstand. Se i numeri sono presenti ma manca la conferma tecnica, puoi verificarla ora senza riscrivere i log. È disponibile anche un assessment attuale del livello. La finestra di 42 giorni e le soglie sono adattamenti operativi, non criteri ufficiali HF.</p><p>Per semplificare usa Regressione in Progressi. Ogni cambio vale dalle nuove sedute ed è registrato. Lo storico iniziale resta immutato e non è sufficiente a certificare qualità tecnica.</p><p>La pike libera richiede tuck comoda. A fine percorso rivaluta il template successivo nei manuali; nuove abilità come press e pike jump richiedono una selezione specifica.</p><p>Settimane 9/18 del ciclo generale: promemoria di scarico, con serie adattabili manualmente. L’endurance e M3 hanno controlli separati.</p></article></div>';
};
function mobilityPlanV2(){return '<article class="card"><h2>M3 · Level 1 completo</h2><p>Combinato Pike/Pancake: alterna 2–4 sedute totali a settimana; sei settimane per fase. Una seduta parziale avanza l’alternanza, ma resta distinta da una completa. “Solo mobilità” non avanza la forza.</p><p>Segui le coppie A1/A2, B1/B2, C1/C2 in alternanza. Tempo = eccentrica / pausa / concentrica / pausa; RIR = ripetizioni in riserva, DIR = secondi in riserva. Una spunta indica tutte le serie dell’esercizio. Annotazioni M3: setup, carico, range e lavoro effettivo se parziale.</p>'+['pike','pancake'].map(k=>'<h3>'+M3[k].title+'</h3>'+Array.from({length:phaseLimit(k)},(_,i)=>i+1).map(p=>'<details><summary>Fase '+p+' · 6 settimane nel combinato</summary><div class="inside">'+m3Items(k,p,'full').map(t=>'<div class="entry"><strong>'+esc(t.name)+'</strong><p>'+esc(t.dose)+'</p><p>'+esc(t.note)+'</p></div>').join('')+'</div></details>').join('')).join('')+'<p>Fonti: M3 Program Templates pp. 2–3, 5–6, 15–17. Fasi Level 2/3 da selezionare tramite assessment quando concluso Level 1.</p><p>Scarico M3: il manuale pp. 43–45 propone, fra le alternative, metà serie arrotondate per difetto e circa 60% dei tempi, oppure circa 75% della profondità mantenendo serie e reps. Non sommare automaticamente i metodi. Annota metodo e dose; nell’app è lavoro parziale rispetto al template. Indicazione generale: 4–8 settimane prima di una settimana di scarico, oppure autoregolazione per chi ha esperienza. Il carico della forza e del core si somma a M3 (manuale p. 39).</p></article>';}
// Use the same documented phase array for the prescription and its margins.
m3Items=(key,p,dose)=>{
 const margins=key==='pike'?['30–40 s DIR','2–3 RIR','5 s DIR',p===2?'3–5 RIR':'2–3 RIR','2–3 RIR']:['2–3 RIR','2–3 RIR',p===2?'2–3 s DIR':'2–3 RIR sulle lifts',p===2?'2 RIR':'5–10 s DIR'];
 return M3[key]['phase'+p].map((x,i)=>task('m'+i,x[0]+' · '+x[1],x[2],x[3]+' · '+margins[i]+'. '+x[4].replace(/Settimane 1-2: 2 serie\. ?/g,'')));
};

// Recover browser-local diaries from earlier versions; source keys remain untouched.
function migrateWebDiary(){
 if(blockedStorage||localStorage.getItem(KEY)!==null)return;
 const migrated=[],warnings=[];
 for(const [oldKey,id]of [['handstand-practice-v3-state','handstand-practice-v3'],['handstand-ppl-v1-state','handstand-ppl-v1'],['handstand-casa-v1-state','handstand-casa-v1']]){
  const raw=localStorage.getItem(oldKey);if(!raw)continue;
  try{const incoming=JSON.parse(raw);if(!obj(incoming)||!Array.isArray(incoming.records))throw Error('Diario precedente non valido');
   const result=importPayload({app:{id},state:incoming},id==='handstand-casa-v1');
   if(id!=='handstand-casa-v1'&&incoming.config){if(validDay(incoming.config.cycleStart))state.config.cycleStart=incoming.config.cycleStart;if(['A','B','C'].includes(incoming.config.nextSession))state.config.nextSession=incoming.config.nextSession;if(['dark','light'].includes(incoming.config.theme))state.config.theme=incoming.config.theme;}
   migrated.push({key:oldKey,added:result.added});
  }catch(e){warnings.push(oldKey);}
 }
 if(migrated.length||warnings.length){state.config.webMigration={at:new Date().toISOString(),migrated,warnings};save();}
}
migrateWebDiary();

save();render();
</script>

<script>

 const hadController=Boolean(navigator.serviceWorker.controller);
 navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
 navigator.serviceWorker.addEventListener('controllerchange',()=>{
  if(!hadController||document.getElementById('webUpdateNotice'))return;
  const n=document.createElement('aside');n.id='webUpdateNotice';n.className='card';n.setAttribute('role','status');n.style.cssText='position:fixed;bottom:5rem;left:1rem;right:1rem;z-index:50';
  const text=document.createElement('p');text.textContent='Nuova versione pronta. Termina o salva la seduta, poi aggiorna l’app.';const button=document.createElement('button');button.textContent='Aggiorna';button.onclick=()=>location.reload();n.append(text,button);document.body.append(n);
 });
}
</script>
